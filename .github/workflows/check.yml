name: Validate Kuhl OS
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static and simulated installer tests
        run: bash tests/validate.sh
  fedora-niri-config:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora's actual Niri package
        run: dnf install -y niri python3
      - name: Validate all six staged theme configurations with Niri
        run: python3 scripts/validate_niri.py
