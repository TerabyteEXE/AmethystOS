name: Validate AmethystOS Gigi Rice Rebase
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  fedora-niri:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Niri parser, and shell utilities
        run: dnf install -y niri python3 bash findutils coreutils
      - name: Check shell scripts, configs, documentation, and backups
        run: bash tests/validate.sh
