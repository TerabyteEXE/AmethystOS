# Fuzzel Configuration - Glassy Dark Theme

[main]
font=Cascadia Mono NF:weight=regular:size=12
dpi-aware=no
terminal=alacritty -e
prompt="❯ "
icon-theme=Papirus
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=20
lines=8
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=f7f3fbed
text=29213dff
match=7553baff
selection=e9e0f5ff
selection-text=29213dff
selection-match=7553baff
# border=8be9fdff

# [border]
# width=1
# radius=12

[dmenu]
mode=text
exit-immediately-if-empty=no
