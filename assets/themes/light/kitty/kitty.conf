# Kitty Terminal Configuration

# ────────────────────────────────────────────────────────────────
# COLOR SCHEME - Glassy Frost Vibrant Dark Theme
# ────────────────────────────────────────────────────────────────

# Cursor & Text
cursor                #8e55ba
cursor_text_color     #faf8ff
cursor_shape          block
cursor_blink_interval 0.5

# Main colors - Dark glassy background with vibrant text
foreground            #27223b
background            #faf8ff
selection_foreground  #faf8ff
selection_background  #8e55ba
url_color             #417bb0
url_style             curly

# Active/Inactive border colors
active_border_color   #8e55ba
inactive_border_color #b0a3c1
bell_border_color     #ad405d

# Tab colors
active_tab_foreground   #faf8ff
active_tab_background   #8e55ba
inactive_tab_foreground #27223b
inactive_tab_background #e4dbf1
tab_bar_background      #faf8ff

# Black (dark grays)
color0   #e4dbf1
color8   #827496

# Red (vibrant crimson/pink)
color1   #ad405d
color9   #bf5169

# Green (electric lime/neon green)
color2   #33865d
color10  #33865d

# Yellow (bright electric yellow/gold)
color3   #9a6c1c
color11  #956d18

# Blue (electric cyan/neon blue)
color4   #417bb0
color12  #39739e

# Magenta (hot pink/neon purple)
color5   #8e55ba
color13  #884faf

# Cyan (electric aqua/bright teal)
color6   #417bb0
color14  #39739e

# White (bright whites)
color7   #27223b
color15  #fdfaff

# Mark colors for selections
mark1_foreground #faf8ff
mark1_background #ad405d
mark2_foreground #faf8ff
mark2_background #33865d
mark3_foreground #faf8ff
mark3_background #9a6c1c

# Font configuration
font_family      Cascadia Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# ────────────────────────────────────────────────────────────────
# WINDOW & VISUAL EFFECTS - Glassy Frost Appearance
# ────────────────────────────────────────────────────────────────

# Window layout with glassy effects
remember_window_size      yes
initial_window_width      1200
initial_window_height     800
window_padding_width      20
window_margin_width       0
single_window_margin_width -1

# Glassy frost effects
background_opacity        0.78
background_blur           0
dynamic_background_opacity yes

# Window decorations
hide_window_decorations   no
window_border_width       2px
draw_minimal_borders      yes
window_margin_width       2

# Tab bar styling
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       angled
tab_bar_margin_width      0.0
tab_bar_margin_height     0.0 0.0
tab_bar_min_tabs          2
tab_activity_symbol       🔥
tab_title_template        " {index}: {title[title.rfind('/')+1:]} "

# Advanced
shell .
editor .
allow_remote_control no
update_check_interval 0

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
mouse_hide_wait 3.0
url_style curly
open_url_with default
copy_on_select yes

# Scrollback
scrollback_lines 10000
confirm_os_window_close 0
