[general]
live_config_reload = true

[window]
decorations = "Full"
padding = { x = 10, y = 10 }
opacity = 0.90

[font]
size = 12

[font.normal]
family = "Cascadia Mono NF"
style = "Regular"

[font.bold]
family = "Cascadia Mono NF"
style = "Bold"

[font.italic]
family = "Cascadia Mono NF"
style = "Italic"

[font.bold_italic]
family = "Cascadia Mono NF"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[bell]
duration = 0

[terminal]
shell = { program = "/usr/bin/fish" }

# Colors: deep navy base with sunset-orange accents
[colors.primary]
background = "#fbf9ff"
foreground = "#302747"

[colors.cursor]
text = "#fbf9ff"
cursor = "#8e691c"

[colors.selection]
text = "#fbf9ff"
background = "#7653af"

[colors.normal]
black = "#e6e0f2"
red = "#ff6e5e"
green = "#36865e"
yellow = "#8e691c"
blue = "#7650b6"
magenta = "#7653af"
cyan = "#3b7697"
white = "#302747"

[colors.bright]
black = "#b5a7c9"
red = "#ff6e5e"
green = "#36865e"
yellow = "#ffd29c"
blue = "#a6bfff"
magenta = "#9b5482"
cyan = "#89dceb"
white = "#fdfaff"
